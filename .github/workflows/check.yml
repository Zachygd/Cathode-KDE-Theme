# Quick checks on every push and pull request.
name: Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell scripts
        run: shellcheck --severity=warning install.sh uninstall.sh get.sh packaging/*.sh
      - name: Python
        run: python3 -m py_compile build/*.py share/cathode/app/cathode_display.py
      - name: JSON
        run: find . -name '*.json' -not -path './.git/*' -print0 | xargs -0 -n1 python3 -m json.tool > /dev/null
      - name: Release builds
        run: packaging/make-release.sh dist && bash dist/Cathode-Installer.run --extract /tmp/cathode-check && test -x /tmp/cathode-check/install.sh
